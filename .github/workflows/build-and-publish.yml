name: Build and Publish to GHCR

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/**'
      - 'pages/**'
      - 'lib/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/build-and-publish.yml'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-nextjs:
    name: Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_GROWTHBOOK_API_HOST: ${{ secrets.NEXT_PUBLIC_GROWTHBOOK_API_HOST || 'https://cdn.growthbook.io' }}
          NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: .next
          retention-days: 7

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-nextjs
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: nextjs-frontend
            context: .
            dockerfile: ./apps/nextjs-frontend/Dockerfile
          - name: module-a
            context: ./apps/module-a
            dockerfile: ./apps/module-a/Dockerfile
          - name: orchestrator
            context: ./apps/orchestrator
            dockerfile: ./apps/orchestrator/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/flowagent-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GROWTHBOOK_API_HOST=${{ secrets.NEXT_PUBLIC_GROWTHBOOK_API_HOST || 'https://cdn.growthbook.io' }}
            NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY || '' }}

      - name: Deployment summary
        run: |
          echo "### 🐳 Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ matrix.service.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            echo "- \`${tag}\`" >> $GITHUB_STEP_SUMMARY
          done

  docker-build-test:
    name: Docker Build Test (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        service:
          - name: nextjs-frontend
            context: .
            dockerfile: ./apps/nextjs-frontend/Dockerfile
          - name: module-a
            context: ./apps/module-a
            dockerfile: ./apps/module-a/Dockerfile
          - name: orchestrator
            context: ./apps/orchestrator
            dockerfile: ./apps/orchestrator/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [build-nextjs, build-and-push-images]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Build and Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Next.js Build | ${{ needs.build-nextjs.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images | ${{ needs.build-and-push-images.result == 'success' && '✅ Published' || needs.build-and-push-images.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
