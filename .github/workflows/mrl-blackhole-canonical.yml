# origin_signature: MrLiouWord
name: MRL Blackhole Canonical Gate
on:
  pull_request:
    paths:
      - 'mrl_blackhole/**'
      - 'tests/test_mrl_blackhole*.py'
      - 'tests/test_celestial_vectors.py'
      - 'cli.py'
      - '.github/workflows/mrl-blackhole-canonical.yml'
  push:
    branches: ['main', 'cursor/notion-mrl-blackhole-model-9f1b', 'Mrliou/blackhole-runtime-continuation-20261013']
    paths:
      - 'mrl_blackhole/**'
      - 'tests/test_mrl_blackhole*.py'
      - 'tests/test_celestial_vectors.py'
      - 'cli.py'
      - '.github/workflows/mrl-blackhole-canonical.yml'
permissions:
  contents: read
  actions: read
jobs:
  canonical-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - name: Verify exact head and run synthetic-only regression
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m pytest tests/test_mrl_blackhole.py tests/test_mrl_blackhole_canonical.py tests/test_mrl_blackhole_translation.py tests/test_mrl_blackhole_genesis.py tests/test_celestial_vectors.py tests/test_mrl_blackhole_local_validation.py
      - name: Validate settled exact head after Neural Branch Sync
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pending=1
          for round in $(seq 1 36); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD&per_page=100" --jq '[.workflow_runs[] | select(.name == "Neural Branch Sync" and .status != "completed")] | length')
            if [ "$pending" = 0 ]; then break; fi
            sleep 5
          done
          test "$pending" = 0
          gh auth setup-git
          git fetch --no-tags origin "$HEAD_BRANCH"
          settled_head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$EXPECTED_HEAD" "$settled_head"
          git diff --name-only "$EXPECTED_HEAD" "$settled_head" > /tmp/mrl-head-diff
          python -c 'from pathlib import Path; allowed={"neural-links/branch-map.json","neural-links/synaptic-graph.mermaid"}; changed=set(Path("/tmp/mrl-head-diff").read_text().splitlines()); assert changed <= allowed, changed'
          git checkout --detach "$settled_head"
          test "$(git rev-parse HEAD)" = "$settled_head"
          echo "SETTLED_EXACT_HEAD=$settled_head"
          python -m pytest tests/test_mrl_blackhole.py tests/test_mrl_blackhole_canonical.py tests/test_mrl_blackhole_translation.py tests/test_mrl_blackhole_genesis.py tests/test_celestial_vectors.py tests/test_mrl_blackhole_local_validation.py
          echo "Exact head tested: $settled_head" >> "$GITHUB_STEP_SUMMARY"
