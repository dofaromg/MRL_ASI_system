name: 🗂️ AI 結構索引更新

on:
  # 定期觸發
  schedule:
    - cron: '0 0 * * 1'  # 每週一 00:00 UTC
    - cron: '0 2 * * *'  # 每天 02:00 UTC (增量)
  
  # Push 觸發 (僅主分支)
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.tsx'
      - '**/README.md'
      - 'MrLiou_AI_SuperComputer/**'
      - 'particle_core/**'
  
  # 手動觸發
  workflow_dispatch:
    inputs:
      scan_depth:
        description: '掃描深度'
        required: false
        default: '8'
      force_update:
        description: '強制完整更新'
        required: false
        default: 'false'
  
  # Issue 評論觸發
  issue_comment:
    types: [created]

jobs:
  authorization-regression:
    if: |
      github.event_name != 'issue_comment' ||
      github.event.comment.body == '@copilot update-structure-index'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test authorization with synthetic repositories only
        run: python -m unittest discover -s tests -p test_Mrliou_structure_authorization.py -v

  update-structure-index:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
      github.event.comment.body == '@copilot update-structure-index')
    
    needs: authorization-regression
    env:
      MRL_SCAN_DEPTH: ${{ github.event.inputs.scan_depth || '8' }}
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整歷史記錄
          persist-credentials: false
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Authorize MRL structure scan, generation and artifact destination
        id: authorization
        run: |
          python .copilot/Mrliou_structure_authorization.py preflight --depth "$MRL_SCAN_DEPTH"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
      
      - name: 🔍 Run Structure Scanner
        id: scan
        run: |
          python .copilot/scanner/structure_scanner.py \
            --root . \
            --depth "$MRL_SCAN_DEPTH" \
            --output .copilot/structure-scan.json
        continue-on-error: false
      
      - name: 🎨 Generate Emoji Index
        id: index
        run: |
          python .copilot/generator/emoji_indexer.py \
            --input .copilot/structure-scan.json \
            --depth "$MRL_SCAN_DEPTH" \
            --output-dir .
        continue-on-error: false
      
      - name: 📊 Check for Changes
        id: check_changes
        run: |
          if git diff --quiet HEAD -- STRUCTURE.md .copilot/structure-index.json .copilot/structure.fltnz; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ 無變更需要提交"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "🔄 檢測到結構變更"
          fi
      
      - name: 📝 Generate Diff Report
        if: steps.check_changes.outputs.has_changes == 'true'
        id: diff
        run: |
          echo "## 📊 結構索引變更報告" > diff-report.md
          echo "" >> diff-report.md
          echo "**更新時間**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> diff-report.md
          echo "**觸發方式**: ${{ github.event_name }}" >> diff-report.md
          echo "" >> diff-report.md
          
          if [ -f .copilot/structure-index.json ]; then
            echo "### 📈 統計變更" >> diff-report.md
            echo "\`\`\`" >> diff-report.md
            git diff --no-color HEAD -- .copilot/structure-index.json | head -50 >> diff-report.md
            echo "\`\`\`" >> diff-report.md
          fi
          
          # Keep the diff local; structure contents are not published to logs.
      
      - name: 📦 Preserve Generated Changes for Review
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "Generated changes await authorization recheck and successful artifact upload."
          echo "Protected main is not mutated directly; apply them through a reviewed PR."
      
      - name: Recheck authorization before artifact upload
        id: upload_authorization
        if: success() && steps.authorization.outputs.allowed == 'true' && steps.scan.outcome == 'success' && steps.index.outcome == 'success'
        run: |
          python .copilot/Mrliou_structure_authorization.py upload --depth "$MRL_SCAN_DEPTH"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload Artifacts
        id: upload
        if: success() && steps.authorization.outputs.allowed == 'true' && steps.scan.outcome == 'success' && steps.index.outcome == 'success' && steps.upload_authorization.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: structure-index-${{ github.run_number }}
          path: |
            .copilot/structure-scan.json
            .copilot/structure-index.json
            .copilot/structure.fltnz
            STRUCTURE.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: 💬 Comment on Issue (if triggered by comment)
        if: success() && github.event_name == 'issue_comment' && steps.check_changes.outputs.has_changes == 'true' && steps.upload.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ 結構索引已通過 MRL 明示授權檢查並封存為 workflow artifact；主分支未被直接修改，請透過審查 PR 套用。'
            })

      - name: ✅ Summary
        if: always()
        env:
          MRL_AUTHORIZED: ${{ steps.authorization.outputs.allowed }}
          MRL_SCAN_OUTCOME: ${{ steps.scan.outcome }}
          MRL_INDEX_OUTCOME: ${{ steps.index.outcome }}
          MRL_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          {
            echo '## MRL structure-index authorization result'
            echo 'origin_signature: MrLiouWord'
            echo "Preflight allowed: ${MRL_AUTHORIZED:-false}"
            echo "Scan: ${MRL_SCAN_OUTCOME:-not_run}"
            echo "Generate: ${MRL_INDEX_OUTCOME:-not_run}"
            echo "Upload: ${MRL_UPLOAD_OUTCOME:-not_run}"
            echo 'No structure content is read by this summary.'
          } >> "$GITHUB_STEP_SUMMARY"
